<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户管理【管理员】</title>
    <style>
        body {
            max-width:900px;
            margin:40px auto;
            padding:0 20px;
            font-family:"Microsoft Yahei",sans-serif;
        }
        .box{
            border:1px solid #ddd;
            padding:24px;
            border-radius:10px;
        }
        .info-bar{
            padding:12px;
            background:#f0f4ff;
            border-radius:6px;
            margin-bottom:20px;
            display:flex;
            align-items:center;
            gap:12px;
            flex-wrap:wrap;
        }
        .item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            border:1px solid #ccc;
            padding:12px 16px;
            border-radius:6px;
            margin:8px 0;
        }
        button{
            padding:6px 12px;
            cursor:pointer;
        }
        .del{
            background:#dd3333;
            color:white;
            border:none;
            border-radius:4px;
        }
        .admin-btn{
            background:#622ce8;
            color:white;
            border:none;
            border-radius:4px;
        }
        .add-area{
            margin:20px 0;
            padding:16px;
            border:1px dashed #999;
            border-radius:8px;
        }
        input{
            padding:8px;
            margin:4px;
            font-size:15px;
        }
        .tip{
            color:red;
        }
    </style>
</head>
<body>
<div class="box">
    <!-- 新增：当前管理员信息栏 -->
    <div class="info-bar">
        <span>当前登录管理员：<b id="adminName">加载中...</b></span>
        <button class="admin-btn" onclick="goEditNick()">修改个人昵称</button>
        <button class="admin-btn" onclick="goEditPwd()">修改登录密码</button>
    </div>

    <h2>普通用户管理（管理员权限）</h2>
    <div class="add-area">
        <h4>新增普通用户</h4>
        <input type="text" id="new_u" placeholder="用户名">
        <input type="password" id="new_p" placeholder="密码">
        <button onclick="addUser()">创建用户</button>
        <p class="tip" id="msg"></p>
    </div>
    <div id="userList"></div>
    <hr>
    <button onclick="backIndex()">返回用户中心首页</button>
</div>

<script>
    const BASE_URL = "http://127.0.0.1:5000";
    const token = localStorage.getItem("token");
    let currentAdminName = "";
    if(!token || token.length <15){
        alert("未登录，请前往登录页面");
        location.href="login.html";
    }

    window.onload = initPage();

    async function initPage(){
        // 获取管理员自身信息
        const resInfo = await fetch(`${BASE_URL}/api/userinfo`,{
            headers:{
                "Authorization":`Bearer ${token}`
            }
        })
        if(resInfo.status===401 || resInfo.status===422){
            alert("登录失效，请重新登录");
            localStorage.clear();
            location.href="login.html";
            return;
        }
        const dataInfo = await resInfo.json();
        currentAdminName = dataInfo.data.username;
        document.getElementById("adminName").innerText = `${currentAdminName}（${dataInfo.data.nickname}）`;

        // 加载普通用户列表
        loadAllUser();
    }

    async function loadAllUser(){
        const res = await fetch(`${BASE_URL}/api/admin/all_user`,{
            headers:{
                "Authorization":`Bearer ${token}`
            }
        })
        if(res.status===403){
            alert("权限不足，仅管理员可访问");
            location.href="index.html";
            return;
        }
        const data = await res.json();
        const wrap = document.getElementById("userList");
        wrap.innerHTML = "<h4>全部普通用户列表</h4>";
        if(data.data.length ===0){
            wrap.innerHTML += "<p>暂无普通用户</p>"
        }
        data.data.forEach(u=>{
            const div = document.createElement("div");
            div.className="item";
            div.innerHTML = `
                <span>账号：${u.username} | 昵称：${u.nickname}</span>
                <button class="del" onclick="delUser(${u.id})">删除用户</button>
            `;
            wrap.appendChild(div);
        })
    }

    async function addUser(){
        const tip = document.getElementById("msg");
        tip.innerText="";
        const username = document.getElementById("new_u").value;
        const pwd = document.getElementById("new_p").value;
        const res = await fetch(`${BASE_URL}/api/register`,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({username,password:pwd})
        })
        const data = await res.json();
        if(data.code===200){
            alert("创建成功！");
            loadAllUser();
        }else{
            tip.innerText = data.msg;
        }
    }

    async function delUser(uid){
        if(!confirm("确认永久删除该普通用户？删除后无法恢复！")) return;
        const res = await fetch(`${BASE_URL}/api/admin/del_user`,{
            method:"DELETE",
            headers:{
                "Content-Type":"application/json",
                "Authorization":`Bearer ${token}`
            },
            body:JSON.stringify({"id":uid})
        })
        const data = await res.json();
        alert(data.msg);
        loadAllUser();
    }

    // 修改昵称跳转，增加确认询问
    function goEditNick(){
        if(confirm(`确定要进入【修改昵称】页面？当前管理员：${currentAdminName}`)){
            location.href="edit_nickname.html";
        }
    }
    // 修改密码跳转，增加确认询问
    function goEditPwd(){
        if(confirm(`确定要进入【修改密码】页面？当前管理员：${currentAdminName}`)){
            location.href="update_pwd.html";
        }
    }

    function backIndex(){
        location.href="index.html";
    }
</script>
</body>
</html>
