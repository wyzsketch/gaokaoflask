<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <style>
        body {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
            font-family: "Microsoft Yahei", sans-serif;
        }
        .box{
            border:1px solid #ddd;
            padding:30px;
            border-radius:10px;
        }
        input{
            width:100%;
            padding:12px;
            font-size:16px;
            margin:10px 0;
        }
        button{
            width:100%;
            padding:12px;
            font-size:16px;
            margin:6px 0;
            cursor:pointer;
        }
        .tip{
            color:red;
        }
    </style>
</head>
<body>
<div class="box">
    <h2>修改登录密码</h2>
    <input type="password" id="old" placeholder="原密码">
    <input type="password" id="new" placeholder="新密码">
    <p class="tip" id="msg"></p>
    <button onclick="savePwd()">确认修改</button>
    <button onclick="backIndex()">返回用户中心</button>
</div>

<script>
    const BASE_URL = "http://127.0.0.1:5000";
    const token = localStorage.getItem("token");
    if(!token){
        alert("请登录");
        location.href="login.html";
    }
    async function savePwd(){
        const tip = document.getElementById("msg");
        const old_pwd = document.getElementById("old").value;
        const new_pwd = document.getElementById("new").value;
        const res = await fetch(`${BASE_URL}/api/user/update_pwd`,{
            method:"PUT",
            headers:{
                "Content-Type":"application/json",
                "Authorization":`Bearer ${token}`
            },
            body:JSON.stringify({old_pwd,new_pwd})
        })
        const data = await res.json();
        if(data.code===200){
            alert("密码修改成功，请重新登录！");
            localStorage.clear();
            location.href="login.html";
        }else{
            tip.innerText=data.msg;
        }
    }
    function backIndex(){
        window.location.href="index.html";
    }
</script>
</body>
</html>
